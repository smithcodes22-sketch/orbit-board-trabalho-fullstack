services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orbitboard-api
    ports:
      - "5200:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Cors__AllowedOrigins: http://localhost:8080,http://localhost:5173
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5200
    container_name: orbitboard-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
